# Vale configuration for in-browser prose linting (design D3 of
# add-vale-prose-linting). The lint worker serves this file and styles/ to
# the Vale WASM via its in-memory filesystem; paths here are relative to
# this file, so the same config works when running stock Vale against the
# vendor/vale/ directory.
#
# .typ is linted through the Markdown path: Vale's native Typst support
# needs the external typst2vast helper process, which cannot exist under
# wasm. The ignore patterns below mask the Typst markup surface armymemo
# memos actually use — hash directives (imports, show rules, code-mode
# calls), math, and labels — so markup is not linted as prose.
StylesPath = styles
MinAlertLevel = suggestion

[formats]
typ = md

[*.{md,typ}]
BasedOnStyles = memo

# Blocks: an #import/#let line, and a #show rule with a multi-line
# argument list closed by a line holding only ")".
BlockIgnores = (?m)(^#(import|let)[^\n]*$), (?ms)(^#show:.*?^\)$), (?m)(^#show:[^\n]*$)

# Inline tokens: #directive(...) / #directive[ calls, $math$, <labels>,
# and @references.
TokenIgnores = (#[A-Za-z][\w.]*(\([^)\n]*\))?), (\$[^$\n]+\$), (<[\w:-]+>), (@[\w:-]+)
