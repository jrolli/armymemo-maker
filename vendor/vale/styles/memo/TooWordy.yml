# Derived from write-good's TooWordy.yml (MIT, see LICENSE), curated for
# Army memos: single words that are ordinary military/administrative
# vocabulary (aircraft, authorize, shall, monitor, requirement, ...) are
# dropped, and entries with one clear plain-writing replacement live in
# ArmyPlain.yml as substitutions instead of being flagged twice.
extends: existence
message: "'%s' is too wordy."
ignorecase: true
level: warning
tokens:
  - a number of
  - adjacent to
  - adversely impact
  - all things considered
  - along the lines of
  - already existing
  - as a matter of fact
  - as a means of
  - as of yet
  - as yet
  - because of the fact that
  - by means of
  - by virtue of
  - by virtue of the fact that
  - close proximity
  - each and every
  - first and foremost
  - for all intents and purposes
  - for the most part
  - for the purpose of
  - have a tendency to
  - honest truth
  - if and when
  - in a manner of speaking
  - in a timely manner
  - in a very real sense
  - in all likelihood
  - in an effort to
  - in excess of
  - in light of the fact that
  - in many cases
  - in some instances
  - in terms of
  - in the case of
  - in the final analysis
  - in the nature of
  - in the near future
  - in the process of
  - incumbent upon
  - irregardless
  - it is essential
  - it seems that
  - null and void
  - on the contrary
  - one particular
  - owing to the fact that
  - point in time
  - readily apparent
  - refer back
  - span across
  - successfully complete
  - the month of
  - the point I am trying to make
  - time period
  - took advantage of
  - until such time as
  - various different
  - what I mean to say is
  - whether or not
  - with respect to
  - with the exception of
  - acquiesce
  - aforementioned
  - ameliorate
  - elucidate
  - remuneration
  - strategize
  - transpire
  - utilization
