<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert a Typst memo file to a signable AR 25-50 Army memo PDF, entirely in your browser."
    />
    <title>Convert a file — memo.army.dev</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1a1d21" />
  </head>
  <body>
    <header class="app-header">
      <h1>memo.army.dev</h1>
      <p class="tagline">Drop a Typst file, get a signable AR 25-50 memo PDF</p>
    </header>

    <main class="app-main convert-main">
      <label class="drop-zone" id="drop-zone" for="file-input">
        <input
          id="file-input"
          class="visually-hidden-input"
          type="file"
          accept=".typ,text/plain"
          aria-describedby="convert-status"
        />
        <span class="drop-zone-title">Drag a Typst memo file here</span>
        <span class="drop-zone-hint">or click to browse — the PDF downloads automatically</span>
      </label>

      <p id="convert-status" class="convert-status" hidden></p>
      <pre id="diagnostics" class="diagnostics convert-diagnostics" hidden></pre>
    </main>

    <footer class="action-bar">
      <div class="footer-meta">
        <p class="local-note">100% local — your document never leaves this browser.</p>
        <p class="last-updated">Updated <time datetime="__LAST_UPDATED__">__LAST_UPDATED__</time></p>
        <nav class="footer-links" aria-label="About this site">
          <a href="/">Memo editor</a>
          <a href="/acknowledgements.html">Acknowledgements</a>
          <a
            class="repo-link"
            href="https://github.com/jrolli/armymemo-maker"
            target="_blank"
            rel="noopener noreferrer"
          >
            Source on GitHub
          </a>
        </nav>
      </div>
    </footer>

    <script type="module" src="/src/convert.ts"></script>
  </body>
</html>
